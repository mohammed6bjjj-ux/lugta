name: flutter_app
description: "Lugta — لكطة mobile commerce app."
publish_to: 'none'
version: 0.1.9+11

environment:
  sdk: ^3.12.2

dependencies:
  cached_network_image: 3.4.1
  cupertino_icons: ^1.0.9
  firebase_core: 4.12.1
  firebase_messaging: 16.4.3
  flutter:
    sdk: flutter
  flutter_local_notifications: 22.1.0
  flutter_secure_storage: 10.3.1
  flutter_localizations:
    sdk: flutter
  flutter_cache_manager: 3.4.2
  gal: 2.3.3
  intl: 0.20.2
  image_picker: 1.2.3
  path_provider: 2.1.6
  share_plus: 13.3.0
  shared_preferences: 2.5.5
  supabase_flutter: 2.16.0
  url_launcher: 6.3.2
  video_player: 2.13.0

dev_dependencies:
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
  fonts:
    - family: Zain
      fonts:
        - asset: assets/fonts/Zain-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Zain-Regular.ttf
          weight: 400
        - asset: assets/fonts/Zain-Bold.ttf
          weight: 700
